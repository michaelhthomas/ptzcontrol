[package]
name = "ptz-controller-relm4"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
default = []
simulator = ["grafton-visca/test-utils"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
relm4 = { version = "0.11", features = ["libadwaita"]  }
relm4-macros = "0.11"
relm4-components = "0.11"
relm4-icons = "0.11"
grafton-visca = { version = "2.0.0", default-features = false, features = ["runtime-tokio", "transport-serial-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

[build-dependencies]
relm4-icons-build = "0.11"
